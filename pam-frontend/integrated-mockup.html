<script type="text/babel">
const { useState, useEffect } = React;

/* ── Loading step hook ── */
function useLoadingStep() {
  const steps = [
    { text: '카드 뽑는 중', dots: 3 },
    { text: '문구 뽑는 중', dots: 3 },
    { text: '이미지에 붙이는 중', dots: 5 },
    { text: '마무리 중', dots: 2 },
  ];
  const [stepIdx, setStepIdx] = useState(0);
  const [dotCount, setDotCount] = useState(0);
  const [visible, setVisible] = useState(true);

  useEffect(() => {
    const t = setInterval(() => {
      setVisible(false);
      setTimeout(() => { setStepIdx(i => (i+1) % steps.length); setDotCount(0); setVisible(true); }, 220);
    }, 2000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    if (dotCount >= steps[stepIdx].dots) return;
    const t = setTimeout(() => setDotCount(d => d+1), 320);
    return () => clearTimeout(t);
  }, [dotCount, stepIdx]);

  return { text: steps[stepIdx].text, dots: '.'.repeat(dotCount), visible };
}

/* ── Animals cycle hook ── */
function useAnimal() {
  const animals = ['🐱','🐶','🐻','🐼','🦊'];
  const [idx, setIdx] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setIdx(i => (i+1) % animals.length), 1600);
    return () => clearInterval(t);
  }, []);
  return animals[idx];
}
