spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 0
      max-lifetime: 600000
      keepalive-time: 0
      connection-timeout: 10000
      idle-timeout: 300000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    redis:
      url: ${REDIS_URL}
      password: ${REDIS_PASSWORD}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
            client-authentication-method: client_secret_post
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope: profile, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 900000              # 15분
  refresh-expiration-ms: 2592000000  # 30일

cloudflare:
  r2:
    endpoint: ${R2_ENDPOINT}
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}
    bucket-name: ${R2_BUCKET_NAME}

oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}

cookie:
  secure: ${COOKIE_SECURE:true}
  domain: ${COOKIE_DOMAIN:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    fail-closed: ${RATE_LIMIT_FAIL_CLOSED:true}
    use-forwarded-headers: ${RATE_LIMIT_USE_FORWARDED_HEADERS:true}
    rules:
      - name: meme-compose
        path: /api/memes/compose
        method: GET
        capacity: ${RATE_LIMIT_COMPOSE_PER_MINUTE:10}
        window: 60s
        key: USER_OR_IP
      - name: meme-create
        path: /api/memes
        method: POST
        capacity: ${RATE_LIMIT_MEME_CREATE_PER_MINUTE:5}
        window: 60s
        key: USER_AND_IP
      - name: oauth2-start
        path: /oauth2/authorization/
        method: GET
        capacity: ${RATE_LIMIT_OAUTH_START_PER_MINUTE:10}
        window: 60s
        key: IP
      - name: oauth2-callback
        path: /login/oauth2/code/
        method: GET
        capacity: ${RATE_LIMIT_OAUTH_CALLBACK_PER_MINUTE:20}
        window: 60s
        key: IP
      - name: auth-me
        path: /api/auth/me
        method: GET
        capacity: ${RATE_LIMIT_AUTH_ME_PER_MINUTE:60}
        window: 60s
        key: USER_AND_IP

server:
  port: 8080
  tomcat:
    connection-timeout: 20000   # 20s: 클라이언트 연결 수립 타임아웃
    keep-alive-timeout: 30000   # 30s: keep-alive 유휴 커넥션 최대 유지시간

logging:
  level:
    com.pickameme: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
    org.redisson: WARN
    software.amazon.awssdk: WARN
