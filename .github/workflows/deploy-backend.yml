name: Deploy Backend to OCI

# TASK-261104-01: 서버(OCI)를 ads_server 저장소에 넘겨주면서 자동 배포를 끕니다.
# push 트리거가 살아 있으면 pam-backend 변경이 main에 들어갈 때마다 pam-backend 컨테이너가 다시 떠서
# 같은 서버의 8080 포트를 차지하고, ads-server 배포를 막습니다.
# 다시 배포해야 하면 Actions 탭에서 수동 실행하되, 그 전에 서버의 ads-server 컨테이너를 먼저 내립니다.
on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pam-backend:latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./pam-backend
          push: true
          tags: ${{ env.IMAGE }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      packages: write
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"
            docker stop pam-backend 2>/dev/null || true
            docker rm pam-backend 2>/dev/null || true
            docker run -d \
              --name pam-backend \
              --restart unless-stopped \
              --env-file ~/pam.env \
              -p 8080:8080 \
              "$IMAGE"
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ env.IMAGE }}

  cleanup-ghcr:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      packages: write
    steps:
      - name: Delete old GHCR images
        uses: actions/delete-package-versions@v5
        with:
          package-name: pam-backend
          package-type: container
          min-versions-to-keep: 2
