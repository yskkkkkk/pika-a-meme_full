name: Deploy Backend to OCI

on:
  push:
    branches:
      - main
    paths:
      - 'pam-backend/**'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pam-backend:latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./pam-backend
          push: true
          tags: ${{ env.IMAGE }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      packages: write
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"
            docker stop pam-backend 2>/dev/null || true
            docker rm pam-backend 2>/dev/null || true
            docker run -d \
              --name pam-backend \
              --restart unless-stopped \
              --env-file ~/pam.env \
              -p 8080:8080 \
              "$IMAGE"
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ env.IMAGE }}

  cleanup-ghcr:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      packages: write
    steps:
      - name: Delete old GHCR images
        uses: actions/delete-package-versions@v5
        with:
          package-name: pam-backend
          package-type: container
          min-versions-to-keep: 2
